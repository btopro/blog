content: "\n<blockquote>\"Problematic\",&nbsp;<span>\"too sarcastic\", </span><span>\"lacks seriousness\"</span></blockquote>\n<grid-plate disable-responsive=\"\" layout=\"1-2-1\"><p slot=\"col-2\">Yes, and so many more issues from there. I am a dad, a believer, a developer, a coach, and opinionated about many a thing. I've worked in web development since the early 2000s and started on a DX 486 \"laptop\" and a large book about HTML in 1997!!</p><img src=\"files/headshot581415.6000000006.jpg?t=1789744330729\" loading=\"lazy\" slot=\"col-3\"><img src=\"files/headshot603198.jpg\" loading=\"lazy\" slot=\"col-1\"><img src=\"files/headshot581415.6000000006.jpg\" loading=\"lazy\" slot=\"col-1\"><img src=\"files/headshot603198.jpg?t=1789744311193\" loading=\"lazy\" slot=\"col-3\"><img src=\"files/headshot1368860.2400000002.jpg\" loading=\"lazy\" slot=\"col-1\"><img src=\"files/headshot1358832.1500000004.jpg\" loading=\"lazy\" slot=\"col-3\"></grid-plate>\n<p>I am the project lead on <a href=\"https://haxtheweb.org/\">HAXTheWeb</a>, which <a href=\"https://github.com/btopro/blog\">powers this blog</a>, and is a large part of my purpose. From HAX I've <a href=\"https://oer.hax.psu.edu/bto108/sites/ist256/welcome\">taught courses</a> at Penn State, I am an advisor to <a href=\"https://github.com/haxtheweb/hax-the-club\">HAXTheClub</a>, mentor to dozens of students through <a href=\"https://haxtheweb.org/hax-lab\">HAX Lab</a> and have become a better coach and human as a result of all the students I've met along the way.</p>\n<p>HAX Seeks ubiquity, and ubiquity in publishing and authoring changes everything.</p>\n<p>I love the web. Hockey. Coaching. Teaching. and all the social scene that pops up around those things.</p>\n<p>Just trying to do the best I can with the time I have remaining.</p>\n<p><b>~!bto-pro</b></p>\n<p></p>\n<image-gallery mode=\"masonry\" accent-color=\"grey\" active-index=\"1\"><media-image source=\"files/Gemini_Generated_Image_hcblyahcblyahcbl-(1).jpg\" accent-color=\"grey\" size=\"wide\" offset=\"none\" alt=\"btopro, in the future, ripped\" resource=\"#3c00f578-4494-d25c-e62a-fdd9e3c134c5\" prefix=\"oer:http://oerschema.org/ schema:http://schema.org/ dc:http://purl.org/dc/terms/ foaf:http://xmlns.com/foaf/0.1/ cc:http://creativecommons.org/ns# bib:http://bib.schema.org \" typeof=\"oer:MediaObject\"></media-image>\n\n\n\n\n\n<media-image source=\"files/headshot422070.074999996.jpg\" alt=\"btopro in a jersey, shocking\" accent-color=\"grey\" size=\"wide\" offset=\"none\" resource=\"#6b8a25b9-eefb-20b7-8eb7-2eaed2b1673e\" prefix=\"oer:http://oerschema.org/ schema:http://schema.org/ dc:http://purl.org/dc/terms/ foaf:http://xmlns.com/foaf/0.1/ cc:http://creativecommons.org/ns# bib:http://bib.schema.org \" typeof=\"oer:MediaObject\"></media-image>\n\n\n\n\n\n<media-image source=\"files/headshot143493.3299999684.jpg\" alt=\"btopro with an elms logo, old school\" accent-color=\"grey\" size=\"wide\" offset=\"none\" resource=\"#49cf667f-e5b9-113f-8c8c-bb4a39875d12\" prefix=\"oer:http://oerschema.org/ schema:http://schema.org/ dc:http://purl.org/dc/terms/ foaf:http://xmlns.com/foaf/0.1/ cc:http://creativecommons.org/ns# bib:http://bib.schema.org \" typeof=\"oer:MediaObject\"></media-image>\n\n\n\n\n\n</image-gallery>\n<p></p>\n"
